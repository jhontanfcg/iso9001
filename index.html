<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio - Capacitación ISO 9001</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="welcome-page">
        <div class="welcome-left">
            <h1>Bienvenidos a la capacitación</h1>
        </div>
        <div class="welcome-right">
            <p>Aprende sobre estándares de calidad y seguridad de la información</p>
        </div>
    </section>

    <section id="registro-empresa">
        <h2>Registro de Empresa</h2>
        <form id="formRegistro">
            <label>Nombre de la empresa:</label>
            <input type="text" id="nombre" required>
            <label>Correo electrónico de contacto:</label>
            <input type="email" id="correo" required>
            <label>Contraseña:</label>
            <input type="password" id="password" required>
            <label>Confirmar contraseña:</label>
            <input type="password" id="confirmPassword" required>
            <label>Sector (opcional):</label>
            <input type="text" id="empresa">
            <label>Tamaño de la empresa (opcional):</label>
            <input type="text" id="rol">
            <button type="submit">Registrar</button>
        </form>

        <div id="registroExitoso" class="seccion-oculta" style="margin-top:15px;">
            <h3>✅ Registro exitoso</h3>
            <p>Bienvenido <span id="usuarioGuardado"></span>. Selecciona el curso:</p>
            <button onclick="iniciarCapacitacion()">ISO 9001</button>
            <button onclick="iniciarISO27001()">ISO 27001</button>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registro = JSON.parse(localStorage.getItem('registroUsuario'));
            if (registro) {
                document.getElementById("registro-empresa").style.display = "none";
                // Assuming course is not here, perhaps redirect or show message
                alert('Ya estás registrado. Ve a 9001.html para el curso.');
            }
        });

        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const empresa = document.getElementById('empresa').value;
            const rol = document.getElementById('rol').value;

            if (password !== confirmPassword) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            const registroUsuario = {
                nombre: nombre,
                correo: correo,
                empresa: empresa,
                rol: rol
            };

            localStorage.setItem('registroUsuario', JSON.stringify(registroUsuario));
            document.getElementById('usuarioGuardado').textContent = nombre;
            document.getElementById('formRegistro').style.display = 'none';
            document.getElementById('registroExitoso').style.display = 'block';
        });

        function iniciarCapacitacion() {
            window.location.href = '9001.html';
        }

        function iniciarISO27001() {
            window.location.href = '27001.html';
        }

        function limpiarRegistro() {
            localStorage.removeItem('registroUsuario');
            location.reload();
        }
    </script>

    <button onclick="limpiarRegistro()" style="margin-top:20px;">Limpiar Registro (para pruebas)</button>
</body>
</html>
